<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

        <!--Tailwind-->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./style.css">

    
    <title>Convertidor PDF</title>
</head>

<body>
    <main class="app-container">
        <header class="header-card">
            <div class="header-icon">
                <div class="pdf-icon">
                
                <div class="pdf-icon">
                    PDF
                </div>

                <div class="arrow-icon">
                    →
                </div>

                <div class="excel-icon">
                    XLS
                </div>
            </div> 
                    
                </div>
            

            <!--informacion-->
            <div class="header-info">
                <h1>Convertidor PDF → Excel</h1>
                <p>Extrae automaticamente informacion de vehiculos desde informes PDF y conviertela en Excel.</p>
            </div>

            <!-- Decoracion-->
             <div class="header-decoracion">
                <div class="map-road"></div>
                <div class="map-point"></div>
             </div>

             <!--Cards-->
             <section class="stats-grid">

                <!--vehiculos encontrados-->
                <article class="stats-card">
                    <div class="stat-icon stat-blue">
                         🚚
                    </div>
                    <div class="stat-info">
                        <span id="totalVehiculos" class="stat-number">
                            0
                        </span>

                        <span class="stat-label">
                            Vehiculos encontrados
                        </span>
                    </div>
                </article>

                <!--aprobados-->

                <article class="stat-card">
                    <div class="stat-icon stat-green">
                        ✓
                    </div>

                    <div class="stat-info">
                        <span  id="totalAprobados" class="stat-number">
                            0
                        </span>

                        <span class="stat-label">Aprobados</span>
                    </div>
                </article>

                <!--Paginas-->
                
             </section>
        


        </header>
    </main>
    




</body>


</html>
